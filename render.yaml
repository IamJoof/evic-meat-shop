services:
  - type: web
    name: evic-meat-shop
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: "Evic Meat & Poultry Shop"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: APP_KEY
        generateValue: true
